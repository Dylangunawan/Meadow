name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev mesa-vulkan-drivers
      - name: Test
        run: cargo test --workspace --release
      - name: Build editor
        run: cargo build --release --bin meadow --bin meadow-cli
      - uses: actions/upload-artifact@v4
        with:
          name: meadow-${{ matrix.os }}
          path: |
            target/release/meadow
            target/release/meadow.exe
            target/release/meadow-cli
            target/release/meadow-cli.exe
