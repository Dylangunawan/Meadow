[workspace]
resolver = "3"
members = [
    "crates/meadow-nbt",
    "crates/meadow-blocks",
    "crates/meadow-core",
    "crates/meadow-export",
    "crates/meadow-script",
    "crates/meadow-render",
    "crates/meadow-app",
    "crates/meadow-cli",
]
default-members = ["crates/meadow-app", "crates/meadow-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Dylangunawan/Meadow"
rust-version = "1.88"

[workspace.dependencies]
meadow-nbt = { path = "crates/meadow-nbt" }
meadow-blocks = { path = "crates/meadow-blocks" }
meadow-core = { path = "crates/meadow-core" }
meadow-export = { path = "crates/meadow-export" }
meadow-script = { path = "crates/meadow-script" }
meadow-render = { path = "crates/meadow-render" }

anyhow = "1"
thiserror = "2"
flate2 = "1.1"
rayon = "1.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1.3"
zstd = "0.13"
parking_lot = "0.12"
rustc-hash = "2"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

# Dependencies are always optimised so debug builds of the editor stay responsive.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
